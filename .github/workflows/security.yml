name: Security and release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts
      - name: Verify source, model and policy isolation
        run: |
          python scripts/check_release.py
          python -m unittest discover -s tests -v
          node scripts/test_database.mjs
          node --check web/site.js
          node --check web/auth.js
          node --check web/workspace.js
      - name: Browser behavior tests with synthetic accounts
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Audit resolved Python and JavaScript dependencies
        run: |
          python -m pip check
          python -m pip_audit --vulnerability-service osv
          npm audit
      - name: Build and smoke-test non-root Linux image
        run: |
          docker build -t creditsure:ci .
          docker run --rm -e ALLOWED_HOSTS=localhost creditsure:ci python -c "from app.main import model; from app.schemas import Applicant; assert model.model is not None; result=model.predict(Applicant(applicant_name='Synthetic',age_years=30,annual_income=600000,loan_amount=250000,annuity_amount=15000).model_dump()); assert 300<=result['credit_score']<=900"
      - name: Scan final image OS and Python packages
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          image: creditsure:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
